name: Rust Game Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Build Release
      run: cargo build --verbose --release

    - name: Upload Game Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wolfenstein_game
        path: target/release/wolf3d_macroquad*
